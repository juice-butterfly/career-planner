# 职引 · nginx 站点配置（http 80 起步；正式域名做好后建议再用 certbot 加 443）
# 放置：sudo cp deploy/nginx.conf /etc/nginx/sites-available/career-planner
#     sudo ln -s /etc/nginx/sites-available/career-planner /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# 部署拓扑：前端静态 dist 由 nginx 托管，/api 同源反代到本机 node:3000（Cookie 天然同源可用）。

server {
    listen 80;
    # 有域名后改成你的域名；没有域名用 IP 时保持 _
    server_name _;

    # 前端构建产物（npm run build 生成）
    root /var/www/career-planner/frontend/dist;
    index index.html;

    # 压缩静态资源，显著省流量 + 提速
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_vary on;

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # AI 职业顾问 SSE 流式回复：必须关闭缓冲，否则流式失效
    location /api/chat/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # 静态资源缓存（带 hash 的构建产物可长时间缓存）
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # history 路由：未知路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}